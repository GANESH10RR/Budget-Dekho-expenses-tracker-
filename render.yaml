databases:
  - name: budgetdekho-demo-db
    databaseName: budgetdekho
    user: budgetdekho
    plan: free
    region: oregon
    ipAllowList: []

services:
  - type: web
    name: budgetdekho-demo-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: READ_ONLY_DEMO
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: budgetdekho-demo-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://budgetdekho-demo.onrender.com

  - type: web
    name: budgetdekho-demo
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://budgetdekho-demo-api.onrender.com/api
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
